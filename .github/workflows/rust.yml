name: Tests

on:
  push:
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Check for parse errors
      run: cargo build --example echo --features aes128gcm_sha256,secp256r1 --features async --release
    - name: Run unit tests
      run: cargo test --features aes128gcm_sha256 --lib
    - name: Run sync basic_tests
      run: cargo test --features aes128gcm_sha256 --test basic_tests --verbose
    - name: Run async basic_tests
      run: cargo test --features aes128gcm_sha256 --features async --test basic_tests --verbose
    - name: Run sync dhe_tests
      run: cargo test --features aes128gcm_sha256,secp256r1 --test dhe_tests --verbose

